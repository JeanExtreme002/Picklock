# Path-based labels applied to PRs by .github/workflows/labeler.yml.
# Uses actions/labeler@v5 match rules.

# The command layer — where a new command or a change to an existing one lands.
commands:
  - changed-files:
      - any-glob-to-any-file:
          - "picklock/commands/**"

# The shell itself: line parsing, dispatch, readline, the CLI front end.
shell:
  - changed-files:
      - any-glob-to-any-file:
          - "picklock/shell.py"
          - "picklock/cli.py"

# Everything that decides how a result looks on screen.
output:
  - changed-files:
      - any-glob-to-any-file:
          - "picklock/output.py"
          - "picklock/valuetypes.py"

# Any change inside the package.
core:
  - changed-files:
      - any-glob-to-any-file:
          - "picklock/**"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "CONTRIBUTING.md"
          - "SECURITY.md"
          - "CODE_OF_CONDUCT.md"
          # The documentation site, the images it and the README show, and
          # the maintainer-only scripts that generate both.
          - "docs/**"
          - "assets/**"
          - "scripts/**"
          - ".readthedocs.yaml"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "Makefile"
          - "codecov.yml"
