# Read the Docs configuration file for Sphinx + MyST.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

formats:
  - htmlzip
  - pdf
  - epub

python:
  install:
    - requirements: docs/requirements.txt
    # Picklock itself, because conf.py generates the command reference from
    # the live command registry — the docs import the package they document.
    - method: pip
      path: .
